<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register • DelishDash</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        * { font-family: 'Poppins', system-ui, sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-zinc-100 to-white min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full">
        <div class="flex justify-center mb-10">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-[#ff4d4d] rounded-3xl flex items-center justify-center text-4xl">🍽️</div>
                <h1 class="text-4xl font-bold tracking-tighter text-neutral-900">DelishDash</h1>
            </div>
        </div>

        <div class="bg-white rounded-3xl shadow-2xl p-10">
            <h2 class="text-3xl font-semibold text-center mb-2">Create Account</h2>
            <p class="text-neutral-500 text-center mb-8">Join millions of happy foodies</p>

            <form action="{{ url_for('register') }}" method="POST" class="space-y-6">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-2 text-neutral-600">First Name</label>
                        <input type="text" name="first_name" class="w-full px-6 py-4 border border-neutral-200 rounded-3xl focus:outline-none focus:border-[#ff4d4d]" placeholder="Rahul" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2 text-neutral-600">Last Name</label>
                        <input type="text" name="last_name" class="w-full px-6 py-4 border border-neutral-200 rounded-3xl focus:outline-none focus:border-[#ff4d4d]" placeholder="Kumar" required>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2 text-neutral-600">Phone Number</label>
                    <input type="tel" name="phone" class="w-full px-6 py-4 border border-neutral-200 rounded-3xl focus:outline-none focus:border-[#ff4d4d]" placeholder="+91 9876543210" required>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2 text-neutral-600">Email</label>
                    <input type="email" name="email" class="w-full px-6 py-4 border border-neutral-200 rounded-3xl focus:outline-none focus:border-[#ff4d4d]" placeholder="you@email.com" required>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2 text-neutral-600">Password</label>
                    <input type="password" name="password" class="w-full px-6 py-4 border border-neutral-200 rounded-3xl focus:outline-none focus:border-[#ff4d4d]" placeholder="Create strong password" required>
                </div>

                <button type="submit"
                        class="w-full bg-[#ff4d4d] hover:bg-[#e63f3f] text-white py-5 rounded-3xl font-semibold text-lg transition">
                    Create Account
                </button>
            </form>

            <p class="text-center text-sm text-neutral-500 mt-8">
                Already have an account? 
                <a href="{{ url_for('login') }}" class="text-[#ff4d4d] font-semibold">Login</a>
            </p>
        </div>
    </div>
</body>
</html>
