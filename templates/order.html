<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed • DelishDash</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        * { font-family: 'Poppins', system-ui, sans-serif; }
        .success-icon { animation: pop 0.6s ease; }
        @keyframes pop { from { transform: scale(0.5); } to { transform: scale(1); } }
    </style>
</head>
<body class="bg-neutral-50 min-h-screen flex items-center justify-center p-6">
    <div class="max-w-lg w-full bg-white rounded-3xl shadow-2xl p-12 text-center">
        <div class="success-icon mx-auto w-28 h-28 bg-green-100 text-green-600 rounded-3xl flex items-center justify-center text-7xl mb-8">
            🎉
        </div>
        <h1 class="text-4xl font-bold mb-3">Order Placed Successfully!</h1>
        <p class="text-neutral-500 text-xl">Your food will arrive in ~25 minutes</p>

        <div class="my-12 p-8 bg-neutral-50 rounded-3xl">
            <p class="text-sm text-neutral-500">Order ID: <span class="font-mono font-semibold">#DD{{ order_id|default('784291') }}</span></p>
            <p class="text-3xl font-bold text-[#ff4d4d] mt-4">₹{{ total|default('598') }}</p>
        </div>

        <a href="{{ url_for('menu') }}" 
           class="block w-full bg-[#ff4d4d] text-white py-6 rounded-3xl font-semibold text-xl hover:bg-[#e63f3f] transition">
            Back to Menu
        </a>
    </div>
</body>
</html>
