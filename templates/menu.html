<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu • DelishDash</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        * { font-family: 'Poppins', system-ui, sans-serif; }
        .food-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .food-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 25px 50px -12px rgb(255 77 77 / 0.3);
        }
    </style>
</head>
<body class="bg-neutral-50">

    <!-- Navbar -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-screen-2xl mx-auto px-8 py-5 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-[#ff4d4d] rounded-3xl flex items-center justify-center text-3xl">🍽️</div>
                <h1 class="text-3xl font-bold tracking-tighter">DelishDash</h1>
            </div>

            <div class="flex items-center gap-8">
                <a href="{{ url_for('menu') }}" class="font-medium text-neutral-700 hover:text-[#ff4d4d]">Menu</a>
                <button onclick="toggleCart()" class="flex items-center gap-2 font-medium relative hover:text-[#ff4d4d]">
                    <i class="fas fa-shopping-cart text-2xl"></i>
                    <span id="cart-count" 
                          class="absolute -top-2 -right-2 bg-[#ff4d4d] text-white text-xs font-bold w-6 h-6 flex items-center justify-center rounded-full">0</span>
                </button>
                <a href="{{ url_for('logout') }}" class="text-red-500 font-medium">Logout</a>
            </div>
        </div>
    </nav>

    <div class="max-w-screen-2xl mx-auto px-8 py-10">
        <h1 class="text-4xl font-bold mb-10">Popular Dishes in Kerala</h1>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-8" id="menu-grid">
            {% for item in menu_items %}
            <div class="food-card bg-white rounded-3xl overflow-hidden shadow">
                <img src="{{ item.image_url }}" alt="{{ item.name }}" 
                     class="w-full h-56 object-cover">
                <div class="p-5">
                    <h3 class="font-semibold text-lg leading-tight">{{ item.name }}</h3>
                    <p class="text-neutral-500 text-sm mt-1 line-clamp-2">{{ item.description }}</p>
                    
                    <div class="flex justify-between items-center mt-6">
                        <span class="text-2xl font-bold text-[#ff4d4d]">₹{{ item.price }}</span>
                        <button onclick="addToCart({{ item.id }}, '{{ item.name|replace("'", "\\'") }}', {{ item.price }})"
                                class="bg-[#ff4d4d] hover:bg-[#e63f3f] text-white px-8 py-3 rounded-3xl text-sm font-semibold transition">
                            Add +
                        </button>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <!-- Cart Sidebar -->
    <div id="cart-sidebar" class="hidden fixed inset-y-0 right-0 w-full md:w-96 bg-white shadow-2xl z-[100] p-6 overflow-auto">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-2xl font-bold">Your Cart</h2>
            <button onclick="toggleCart()" class="text-3xl text-neutral-400 hover:text-black">×</button>
        </div>

        <div id="cart-items" class="space-y-6 min-h-[200px]">
            <!-- Populated by JavaScript -->
        </div>

        <div class="mt-10 pt-6 border-t">
            <div class="flex justify-between items-center text-xl">
                <span class="font-medium">Total Amount</span>
                <span id="cart-total" class="font-bold text-3xl text-[#ff4d4d]">₹0</span>
            </div>
            <button onclick="placeOrder()" 
                    class="mt-8 w-full bg-[#ff4d4d] hover:bg-[#e63f3f] text-white py-6 rounded-3xl font-semibold text-lg transition">
                Place Order • Pay on Delivery
            </button>
        </div>
    </div>

    <script>
        let cart = [];

        function addToCart(id, name, price) {
            const existing = cart.find(item => item.id === id);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ id, name, price, qty: 1 });
            }
            updateCartUI();
            
            // Nice toast notification
            showToast(`${name} added to cart`);
        }

        function updateCartUI() {
            // Update count badge
            document.getElementById('cart-count').textContent = cart.reduce((sum, item) => sum + item.qty, 0);

            // Render cart items
            const container = document.getElementById('cart-items');
            let html = '';

            if (cart.length === 0) {
                html = `<p class="text-center text-neutral-400 py-10">Your cart is empty</p>`;
            } else {
                cart.forEach((item, index) => {
                    html += `
                        <div class="flex justify-between items-center">
                            <div class="flex-1">
                                <p class="font-medium">${item.name}</p>
                                <p class="text-sm text-neutral-500">₹${item.price} × ${item.qty}</p>
                            </div>
                            <div class="flex items-center gap-3">
                                <button onclick="changeQty(${index}, -1)" class="w-8 h-8 flex items-center justify-center border rounded-2xl">-</button>
                                <span class="font-semibold w-6 text-center">${item.qty}</span>
                                <button onclick="changeQty(${index}, 1)" class="w-8 h-8 flex items-center justify-center border rounded-2xl">+</button>
                                <button onclick="removeItem(${index})" class="text-red-500 ml-2">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });
            }
            container.innerHTML = html;

            // Calculate total
            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            document.getElementById('cart-total').textContent = `₹${total}`;
        }

        function changeQty(index, delta) {
            cart[index].qty += delta;
            if (cart[index].qty < 1) cart.splice(index, 1);
            updateCartUI();
        }

        function removeItem(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function toggleCart() {
            const sidebar = document.getElementById('cart-sidebar');
            sidebar.classList.toggle('hidden');
            if (!sidebar.classList.contains('hidden')) {
                updateCartUI();
            }
        }

        function placeOrder() {
            if (cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }
            window.location.href = "{{ url_for('order') }}";
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-6 right-6 bg-[#ff4d4d] text-white px-6 py-4 rounded-3xl shadow-2xl flex items-center gap-3 z-[200]';
            toast.innerHTML = `✅ ${message}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        // Initialize
        window.onload = () => {
            console.log('%c✅ DelishDash Menu Ready!', 'color:#ff4d4d; font-weight:bold');
        };
    </script>
</body>
</html>
